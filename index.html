<script id="math-core">'use strict';
const MathCore=(()=>{
const SPLITS={5:[3,1,1,0],10:[5,3,2,0],15:[8,4,3,0],20:[10,6,3,1],25:[13,7,4,1],30:[15,9,5,1]},LEVELS=['easy','medium','hard','nut'];
function calculate(a,op,b){return op==='+'?a+b:a-b;}
function regroup(a,op,b){let carry=0,cs=[],bs=[];for(let p=0;p<Math.max(String(a).length,String(b).length);p++){let x=Math.floor(a/10**p)%10,y=Math.floor(b/10**p)%10;if(op==='+'){carry=Math.floor((x+y+carry)/10);if(carry)cs.push(p);}else{carry=Number(x-carry-y<0);if(carry)bs.push(p);}}return{carry:cs,borrow:bs};}
function signature(t){return t.steps.map(s=>s.op==='+'?[Math.min(s.a,s.b),'+',Math.max(s.a,s.b)].join(''):`${s.a}-${s.b}`).join(';');}
function validateBank(bank){let errors=[],seen=new Set(),ids=new Set();if(bank.length!==300)errors.push('Bankā jābūt 300 uzdevumiem.');for(const b of ['A','B']){const a=bank.filter(t=>t.bank===b);if(a.length!==150)errors.push(b+' skaits');LEVELS.forEach((l,i)=>{if(a.filter(t=>t.level===l).length!==[75,45,24,6][i])errors.push(b+' '+l);});}
for(const t of bank){if(ids.has(t.id)||seen.has(signature(t)))errors.push('Dublikāts '+t.id);ids.add(t.id);seen.add(signature(t));if(!['A','B'].includes(t.bank)||!LEVELS.includes(t.level))errors.push('Kategorija '+t.id);if(t.steps.length!==(t.level==='nut'?2:1))errors.push('Soļu skaits '+t.id);
t.steps.forEach((s,i)=>{let n=calculate(s.a,s.op,s.b),r=regroup(s.a,s.op,s.b);if(!['+','-'].includes(s.op)||![s.a,s.b,n].every(Number.isInteger)||n!==s.result||n<0||n>(t.bank==='A'?100:200))errors.push('Aprēķins '+t.id);if(i&&s.a!==t.steps[i-1].result)errors.push('Starprezultāts '+t.id);if(t.level!=='nut'&&(s.a<10||s.a>99||s.b<10||s.b>99))errors.push('Divciparu '+t.id);if(JSON.stringify(r.carry)!==JSON.stringify(s.carry)||JSON.stringify(r.borrow)!==JSON.stringify(s.borrow))errors.push('Pārnese '+t.id);if(!s.explanation.length)errors.push('Skaidrojums '+t.id);});
if(t.result!==t.steps.at(-1).result||JSON.stringify(t.intermediates)!==JSON.stringify(t.steps.slice(0,-1).map(s=>s.result)))errors.push('Gala rezultāts '+t.id);}
if(bank.filter(t=>t.bank==='B'&&t.steps.some(s=>s.result>100)).length<45)errors.push('Izaicinājumu daudzums');return errors;}
function shuffle(a,rng=Math.random){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function selectTasks(bank,range,count,history=[],rng=Math.random){if(!SPLITS[count])throw Error('Nederīgs skaits');let result=[];LEVELS.forEach((level,i)=>{let pool=shuffle(bank.filter(t=>t.bank===range&&t.level===level),rng);pool.sort((a,b)=>history.lastIndexOf(a.id)-history.lastIndexOf(b.id));result.push(...pool.slice(0,SPLITS[count][i]));});return shuffle(result,rng);}
function value(digits){const s=digits.map(x=>x===''?' ':String(x)).join('').trimStart();return /^\d{1,3}$/.test(s)?Number(s):null;}
function blankResponse(task){return{step:0,answers:task.steps.map(()=>['','','']),notes:task.steps.map(()=>['','','']),attempts:task.steps.map(()=>0),status:task.steps.map(()=>'open'),first:task.steps.map(()=>null),done:false};}
function grade(task,r,mode){const steps=task.steps.map((s,i)=>({correct:value(r.answers[i])===calculate(s.a,s.op,s.b)&&(mode==='test'||r.status[i]==='correct'),incomplete:value(r.answers[i])===null,revealed:r.status[i]==='revealed',given:value(r.answers[i]),followThrough:i>0&&value(r.answers[i-1])!==null&&value(r.answers[i])===calculate(value(r.answers[i-1]),s.op,s.b)}));return{steps,correct:steps.every(s=>s.correct),incomplete:steps.some(s=>s.incomplete),independent:steps.every((s,i)=>s.correct&&(mode==='test'||r.first[i]===true))};}
function feedback(task,r,index){const s=task.steps[index],n=value(r.answers[index]);if(n===null)return{kind:'empty',text:'Ieraksti atbildi. Sāc ar vieniem labajā pusē; neatstāj tukšu vietu starp cipariem.'};r.attempts[index]++;const ok=n===calculate(s.a,s.op,s.b);if(r.first[index]===null)r.first[index]=ok;if(ok){r.status[index]='correct';return{kind:'correct',text:'Tieši tā! Vēl viens solis tuvāk dārgumiem.'};}if(r.attempts[index]===1)return{kind:'hint',text:s.op==='+'?'Sāc ar vieniem. Ja sanāk 10 vai vairāk, atceries pārnest 1 uz nākamo stabiņu. Pārbaudi arī desmitus!':'Sāc ar vieniem. Ja augšā vienu nepietiek, aizņemies 1 desmitu. Desmitu tad paliek par vienu mazāk.'};r.status[index]='revealed';return{kind:'revealed',text:'Izpētīsim kopā! Tavs mēģinājums palīdz saprast nākamo soli.'};}
function analyze(tasks,responses,mode){const grades=tasks.map(t=>grade(t,responses[t.id],mode));const score=grades.filter(g=>g.correct).length;return{total:tasks.length,score,percent:Math.round(score/tasks.length*100),independent:grades.filter(g=>g.independent).length,assisted:grades.filter(g=>g.correct&&!g.independent).length,incomplete:grades.filter(g=>g.incomplete).length,grades,reward:tasks.length===30&&score===30,errors:tasks.filter((t,i)=>!grades[i].correct).map(t=>t.id)};}
return{SPLITS,LEVELS,calculate,regroup,signature,validateBank,shuffle,selectTasks,value,blankResponse,grade,feedback,analyze};
})();
</script>

function renderHome(){setView('home');app.innerHTML=`<nav class="setup-back" aria-label="Atpakaļ uz uzdevumu izvēli">${btn('home','← Visi piedzīvojumi','button-link')}</nav>${db.active?`<div class="resume-banner"><div><strong>Tavs piedzīvojums gaida!</strong><p class="small">${db.active.ids.length} uzdevumi · ${db.active.mode==='test'?'Pārbaudes darbs':'Treniņš'} · līdz ${db.active.bank==='A'?100:200}</p></div>${btn('resume','Turpināt ceļu →','button-green')}</div>`:''}
<section class="hero"><div class="hero-copy"><span class="pill">2. KLASES ATKLĀJĒJIEM</span><h1>Mazi soļi.<span>Lieli atklājumi.</span></h1><p>Čau! Es esmu Rūdis. Nāc līdzi — atrisināsim stabiņus un atradīsim salas dārgumus!</p><div class="hero-foot"><div class="stamp">RĒĶINI<br>ATKLĀJ<br>PRIECĀJIES</div><p class="small muted">Nesteidzies.<br>Katrs aprēķins ir jauns solis.</p></div></div>${document.getElementById('map-template').innerHTML}</section>
<section class="setup" aria-label="Piedzīvojuma izvēle"><div class="setup-left"><span class="eyebrow">01 / Sakravā mugursomu</span><h2>Cik soļus iesim?</h2><div class="count-options" role="group" aria-label="Uzdevumu skaits">${[5,10,15,20,25,30].map(n=>btn('count',n,'',`data-value="${n}" aria-pressed="${settings.count===n}" aria-label="${n} uzdevumi"`)).join('')}</div><div class="reward-note"><span aria-hidden="true" style="font-size:27px">🎁</span><div><strong>30 pareizi = balva no vecākiem!</strong>Parādi balvas kuponu un vienojieties par mazu pārsteigumu.</div></div><p class="small" style="margin-top:14px" id="count-note">${settings.count>=20?'🥜 Šajā ceļā slēpjas arī viens Cietais rieksts.':'Īss piedzīvojums arī ir piedzīvojums!'}</p></div><div class="setup-right"><div><span class="option-label">02 / Izvēlies salu</span><div class="option-group" role="group" aria-label="Skaitļu diapazons">${btn('bank','Līdz 100<small>Skola2030 pamati</small>','',`data-value="A" aria-pressed="${settings.bank==='A'}"`)}${btn('bank','Līdz 200<small>Papildu izaicinājums</small>','',`data-value="B" aria-pressed="${settings.bank==='B'}"`)}</div></div><div><span class="option-label">03 / Kā rēķināsim?</span><div class="option-group" role="group" aria-label="Darba režīms">${btn('mode','Treniņš<small>Rūdis palīdz pa ceļam</small>','',`data-value="practice" aria-pressed="${settings.mode==='practice'}"`)}${btn('mode','Pārbaudes darbs<small>Rezultāts finišā</small>','',`data-value="test" aria-pressed="${settings.mode==='test'}"`)}</div></div>${btn('start','Sākt rēķināt! <span aria-hidden="true">→</span>','button-primary full')}</div></section><div class="row wrap spread no-print"><button class="button-link" data-action="help">Kā rēķināt stabiņā?</button>${db.errors.length?btn('repeat-all',`Atkārtot kļūdas (${db.errors.filter(id=>byId[id].bank===settings.bank).length})`,'button-link'):''}</div>`;}
function begin(repeatIds=null){const chosen=repeatIds?C.shuffle(repeatIds.map(id=>byId[id])).slice(0,30):C.selectTasks(BANK,settings.bank,settings.count,db.seen[settings.bank]);if(!chosen.length){toast('Šajā salā pagaidām nav kļūdu, ko atkārtot.');return;}
session={ids:chosen.map(t=>t.id),count:chosen.length,bank:chosen[0].bank,mode:repeatIds?'practice':settings.mode,index:0,elapsed:0,started:Date.now(),responses:Object.fromEntries(chosen.map(t=>[t.id,C.blankResponse(t)])),repeat:!!repeatIds};let seen=db.seen[session.bank];for(let id of session.ids){seen=seen.filter(x=>x!==id);seen.push(id);}db.seen[session.bank]=seen;db.active=session;notice=null;setView('game');save();renderGame();focusDigit();}
function requestStart(repeatIds=null){if(db.active){showDialog('Sākt jaunu ceļu?',`<p>Iepriekšējais nepabeigtais darbs tiks aizstāts ar jaunu. Izpildīto darbu vēsture paliks.</p><div class="row wrap" style="margin-top:18px">${btn('cancel-modal','Turpināt iepriekšējo','button-soft')}${btn('confirm-start','Sākt jaunu','button-primary')}</div>`);document.querySelector('[data-action="confirm-start"]').onclick=()=>{closeDialog();begin(repeatIds);};document.querySelector('[data-action="cancel-modal"]').onclick=()=>{closeDialog();session=db.active;setView('game');renderGame();};}else begin(repeatIds);}
function answerComplete(t,r){return t.steps.every((s,i)=>C.value(r.answers[i])!==null);}
function completedCount(){return tasks(session).filter(t=>session.mode==='test'?answerComplete(t,session.responses[t.id]):session.responses[t.id].done).length;}
function operand(n){let a=n===null?['?','?','?']:String(n).padStart(3,' ').split('');return a.map(x=>`<span class="operand">${x===' '?'&nbsp;':x}</span>`).join('');}
function columnHTML(t,r,k){const s=t.steps[k];let a=k===1?(session.mode==='practice'&&r.status[0]==='revealed'?s.a:C.value(r.answers[0])):s.a;const locked=session.mode==='practice'&&r.status[k]!=='open';return`<div class="column ${locked?r.status[k]:''}" aria-label="${k+1}. aprēķins stabiņā"><span></span><span class="place">SIMTI</span><span class="place">DESMITI</span><span class="place">VIENI</span>${r.showNotes?`<span></span>${[0,1,2].map((d)=>`<input class="note-digit" data-note="${d}" inputmode="numeric" maxlength="2" pattern="[0-9]*" autocomplete="off" aria-label="${['Simtu','Desmitu','Vienu'][d]} pārnesuma vai aizņemšanās piezīme" value="${r.notes[k][d]}" ${locked?'readonly':''}>`).join('')}`:''}<span></span>${operand(a)}<span class="op" aria-hidden="true">${s.op==='+'?'+':'−'}</span>${operand(s.b)}<div class="line"></div><span></span>${[0,1,2].map(d=>`<input class="digit" data-digit="${d}" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="off" enterkeyhint="${d===0?'done':'next'}" aria-label="Atbilde: ${['simti','desmiti','vieni'][d]}" value="${r.answers[k][d]}" ${locked?'readonly':''}>`).join('')}</div>`;}
function feedbackHTML(t,r,k){let n=notice;if(!n&&r.status[k]==='correct')n={kind:'correct',text:'Tieši tā! Vēl viens solis tuvāk dārgumiem.'};if(!n&&r.status[k]==='revealed')n={kind:'revealed',text:'Izpētīsim kopā!'};if(!n&&r.attempts[k]===1&&r.status[k]==='open')n={kind:'hint',text:t.steps[k].op==='+'?'Sāc ar vieniem un pārbaudi pārnesumu. Vari mēģināt vēlreiz!':'Pārbaudi, vai jāaizņemas desmits. Vari mēģināt vēlreiz!'};if(!n)return'';return`<div class="feedback ${n.kind}" role="status"><h3>${{correct:'✓ Izdevās!',hint:'Vēl viens mēģinājums!',revealed:'Rūdis parāda ceļu',empty:'Vispirms ieraksti atbildi'}[n.kind]}</h3><p>${n.text}</p>${n.kind==='revealed'?`<p><strong>Pareizā atbilde: ${t.steps[k].result}</strong></p><ol>${t.steps[k].explanation.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}</div>`;}
function renderGame(){const t=byId[session.ids[session.index]],r=session.responses[t.id],k=r.step,done=completedCount(),progress=Math.round(done/session.ids.length*100),open=r.status[k]==='open',two=t.steps.length===2;const stage=Math.min(5,Math.floor(done/session.ids.length*6));
app.innerHTML=`<div class="game-shell"><div class="game-status">${btn('pause','← Pauze','button-link')}<div><div class="row spread progress-label"><span>${session.mode==='test'?'Pārbaudes darbs':session.repeat?'Kļūdu treniņš':'Treniņš'} · līdz ${session.bank==='A'?100:200}</span><span>${done}/${session.ids.length}</span></div><div class="progress-track" role="progressbar" aria-label="Izpildīti uzdevumi" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${session.ids.length}"><div class="progress-fill" style="width:${progress}%"></div></div></div></div>
<div class="mobile-trail">${fox}<div><strong>${route[stage]}</strong><div class="trail-marks" aria-label="Atklātā salas daļa">${route.map((x,i)=>`<span class="${i<=stage?'lit':''}"></span>`).join('')}</div></div><svg class="trail-chest" aria-hidden="true"><use href="#chest"/></svg></div><div class="game-layout"><section class="task-paper"><header class="task-head"><strong>Uzdevums ${session.index+1} no ${session.ids.length}</strong><span class="pill ${t.level==='nut'?'nut':''}">${labels[t.level]}</span></header><div class="task-body"><h2>${two?'Atver riekstu divos soļos!':t.steps[0].op==='+'?'Saskaiti stabiņā!':'Atņem stabiņā!'}</h2><p class="small muted">${two?(k===0?'Vispirms atrisini pirmo aprēķinu.':'Tagad izmanto pirmā soļa atbildi.'):'Sāc ar vieniem — labajā pusē.'}</p>${two?`<div class="step-toggle" aria-label="Aprēķina soļi">${[0,1].map(i=>btn('step',`${i+1}. solis`,'',`data-value="${i}" aria-current="${k===i}" ${i===1&&session.mode==='practice'&&r.status[0]==='open'?'disabled':''}`)).join('')}</div>`:''}${columnHTML(t,r,k)}${btn('notes',r.showNotes?'Paslēpt pierakstu':'✎ Pieraksti pārnesumu / aizņemšanos','button-link small',`aria-expanded="${!!r.showNotes}"`)}<p class="small muted">Tukšus sākuma stabiņus vari atstāt.<br>Ciparus raksti no labās uz kreiso.</p>${session.mode==='practice'?feedbackHTML(t,r,k):''}</div><div class="nav-actions">${session.mode==='practice'?(open?btn('check',r.attempts[k]?'Mēģināt vēlreiz →':'Pārbaudīt atbildi →','button-primary full'):two&&k===0?btn('next-step','Tagad 2. solis →','button-green full'):btn('next',session.index===session.ids.length-1?'Atvērt rezultātu ✦':'Nākamais piemērs →','button-green full')):(two&&k===0?btn('next-step','Uz 2. soli →','button-primary full'):btn('next',session.index===session.ids.length-1?'Pabeigt darbu ✦':'Saglabāt un tālāk →','button-primary full'))}<div class="nav-secondary">${btn('previous','← Iepriekšējais','button-soft',session.index===0?'disabled':'')}${session.mode==='practice'&&open?btn('skip','Izlaist pagaidām','button-link'):btn('finish','Pabeigt darbu','button-link')}</div></div></section>
<aside class="game-aside"><div class="coach ${r.status[k]==='correct'?'happy':''}">${fox}<strong>Rūdis saka:</strong><p>${session.mode==='test'?'Tu esi ceļa vadītājs! Atbildes pārbaudīsim finišā.':two?'Divi mazi aprēķini kopā paveic lielu darbu. Nesteidzies!':r.status[k]==='correct'?'Lieliski! Tavā mugursomā ir vēl viena jauna prasme.':'Sāc labajā pusē. Vieni zem vieniem, desmiti zem desmitiem.'}</p></div><div class="route-card"><h3>Tavs ceļš pa salu</h3><ol class="route-list">${route.map((x,i)=>`<li class="${i<stage?'visited':i===stage?'current':''}"><span class="route-dot">${i<stage?'✓':i+1}</span>${x}</li>`).join('')}</ol></div></aside></div>
<nav class="task-map" aria-label="Pāriet uz uzdevumu">${session.ids.map((id,i)=>{const q=session.responses[id],has=answerComplete(byId[id],q);return btn('jump',i+1,session.mode==='test'?(has?'answered':''):(q.done?(C.grade(byId[id],q,session.mode).correct?'solved':'helped'):''),`data-value="${i}" aria-current="${i===session.index}" aria-label="Uzdevums ${i+1}${has?', atbilde ievadīta':''}"`);}).join('')}</nav><p class="small muted center">${session.mode==='test'?'Atbildes vari mainīt līdz darba pabeigšanai. Zaļš numurs nozīmē, ka atbilde ir ievadīta.':'Vari pārslēgties starp uzdevumiem. Dzeltenie numuri rāda, kur Rūdis palīdzēja.'}</p></div>`;}
function focusDigit(){setTimeout(()=>{const a=[...app.querySelectorAll('.digit:not([readonly])')];const target=[...a].reverse().find(e=>!e.value)||a.at(-1);target?.focus({preventScroll:true});},30);}
function handleInput(e){const input=e.target;if(!input.matches('.digit,.note-digit')||!session)return;const t=byId[session.ids[session.index]],r=session.responses[t.id],k=r.step;let cleaned=input.value.replace(/[^0-9]/g,'');if(input.matches('.note-digit')){input.value=cleaned.slice(-2);r.notes[k][Number(input.dataset.note)]=input.value;}else{input.value=cleaned.slice(-1);const i=Number(input.dataset.digit);r.answers[k][i]=input.value;if(session.mode==='test')r.done=answerComplete(t,r);notice=null;if(input.value&&i>0){let next=app.querySelector(`[data-digit="${i-1}"]`);next.focus({preventScroll:true});next.select();}}saveSession();}
function changeStep(n){const t=byId[session.ids[session.index]],r=session.responses[t.id];if(n===1&&session.mode==='practice'&&r.status[0]==='open')return;r.step=n;notice=null;saveSession();renderGame();focusDigit();}
function check(){const t=byId[session.ids[session.index]],r=session.responses[t.id];if(r.status[r.step]!=='open')return;notice=C.feedback(t,r,r.step);r.done=r.status.every(x=>x!=='open');saveSession();renderGame();announce(notice.text);if(notice.kind==='correct'){confetti(9);}if(notice.kind==='empty'||notice.kind==='hint')focusDigit();}
function next(){if(session.index<session.ids.length-1){session.index++;notice=null;saveSession();renderGame();window.scrollTo({top:0,behavior:'instant'});focusDigit();}else requestFinish();}
function requestFinish(){const missing=tasks(session).filter(t=>session.mode==='test'?!answerComplete(t,session.responses[t.id]):!session.responses[t.id].done).length;if(missing){showDialog('Vēl ir neatklāti soļi',`<p>Vēl ${missing} ${missing===1?'uzdevums nav pabeigts':'uzdevumi nav pabeigti'}. Vari turpināt vai apskatīt pašreizējo rezultātu.</p><div class="row wrap" style="margin-top:20px">${btn('return-game','Turpināt rēķināt','button-green')}${btn('confirm-finish','Pabeigt tagad','button-soft')}</div>`);document.querySelector('[data-action="return-game"]').onclick=closeDialog;document.querySelector('[data-action="confirm-finish"]').onclick=()=>{closeDialog();finish();};}else finish();}
function finish(){tick();const copy=JSON.parse(JSON.stringify(session));lastResult={session:copy,finished:Date.now()};db.history.unshift(lastResult);db.history=db.history.slice(0,10);const a=C.analyze(tasks(copy),copy.responses,copy.mode);db.errors=db.errors.filter(id=>!copy.ids.includes(id));db.errors=[...new Set([...db.errors,...a.errors])];db.active=null;session=null;save();renderResult(lastResult);if(a.score===a.total)confetti(a.reward?75:28);}
function timeLabel(ms){const secs=Math.floor(ms/1000);return `${Math.floor(secs/60)} min ${secs%60} s`;}
function resultMetric(ts,grades,predicate,title){const matching=ts.map((t,i)=>({t,g:grades[i]})).filter(x=>predicate(x.t));return`<div class="stat"><span>${title}</span><strong>${matching.length?matching.filter(x=>x.g.correct).length+'/'+matching.length:'—'}</strong></div>`;}
function recommendations(ts,a){let p=[];const rows=ts.map((t,i)=>({t,g:a.grades[i]}));const borrow=rows.filter(x=>x.t.steps.some(s=>s.borrow.length));const carry=rows.filter(x=>x.t.steps.some(s=>s.carry.length));const plain=rows.filter(x=>x.t.steps.length===1&&x.t.steps[0].op==='+'&&!x.t.steps[0].carry.length);if(plain.length&&plain.every(x=>x.g.correct))p.push('Tev labi izdodas saskaitīt bez pārnesuma.');if(borrow.some(x=>!x.g.correct))p.push('Patrenējies atņemt, aizņemoties desmitu. Palīgā var nākt mazie pieraksta lodziņi.');if(carry.some(x=>!x.g.correct))p.push('Vēl pavingrinies saskaitīt ar pārnesumu: pieraksti pārnesto 1 nākamajā stabiņā.');if(rows.some(x=>x.t.level==='nut'&&x.g.correct))p.push('Tu atrisināji Cieto riekstu — abus aprēķinus!');if(a.score===a.total)p.push('Nākamreiz vari izvēlēties garāku ceļu vai papildu izaicinājumu līdz 200.');if(!p.length)p.push('Izvēlies “Atkārtot kļūdas” un izpēti aprēķinus pa vienam. Tu vari kļūt arvien drošāks!');return p;}
function reviewHTML(t,r,g,index,mode){return`<details class="review"><summary><span>${index+1}. ${expression(t)}</span><span class="chip">${g.correct?'✓ Pareizi':g.incomplete?'Nav pabeigts':g.steps.some(s=>s.revealed)?'Ar Rūda palīdzību':'Jāpārskata'}</span></summary>${t.steps.map((s,k)=>{const gs=g.steps[k];return`<div class="review-step"><strong>${t.steps.length===2?(k+1)+'. solis · ':''}${s.a} ${s.op==='+'?'+':'−'} ${s.b} = ${s.result}</strong><p class="small">Tava atbilde: <strong>${gs.given===null?'nav pilnas atbildes':gs.given}</strong> · ${gs.revealed?'atbildi parādīja Rūdis':gs.correct?'✓ pareizi':'jāpārskata'}${mode==='practice'&&gs.correct&&r.first[k]===false?' · pēc mājiena':''}</p>${k===1&&!g.steps[0].correct&&gs.followThrough?'<p class="small">Ar savu pirmā soļa skaitli tu otro aprēķinu veici pareizi. Pārbaudi pirmo soli — viss uzdevums vēl nav pareizs.</p>':''}${!gs.correct?'<p class="small">Pārbaudi šo aprēķinu pa soļiem.</p>':''}<ol>${s.explanation.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;}).join('')}</details>`;}
function renderResult(item){setView('results');lastResult=item;const s=item.session,ts=tasks(s),a=C.analyze(ts,s.responses,s.mode);app.innerHTML=`<section class="results"><div class="result-hero"><span class="eyebrow">Piedzīvojuma dienasgrāmata</span><h1>${a.reward?'Visa sala ir tavējā!':a.score===a.total?'Dārgumi atrasti!':'Tu jau esi ticis tālāk!'}</h1><div class="result-number">${a.score}<span> / ${a.total}</span></div><p><strong>${a.percent}% pareizi</strong> · ${a.score===a.total?'Skaists darbs, atklājēj!':'Katrs mēģinājums palīdz iemācīties.'}</p><div class="result-meta"><span>◷ ${timeLabel(s.elapsed)}</span><span>${s.mode==='test'?'Pārbaudes darbs':'Treniņš'} · līdz ${s.bank==='A'?100:200}</span></div></div>
${a.reward?`<div class="ticket"><div class="seal" aria-hidden="true">🎁</div><span class="eyebrow">Rūda īpašais balvas kupons</span><h2>30 no 30!<br>Tev pienākas balva no vecākiem!</h2><p>Tu pareizi atrisināji visus 30 uzdevumus. Parādi šo kuponu mammai, tētim vai savam pieaugušajam un kopā izvēlieties mazu balvu!</p><p class="small">Kopīga spēle, mīļākais našķis vai īpašs piedzīvojums — par balvu vienojieties paši.</p><div class="reward-write">Atklājēja vārds:</div><div class="reward-write">Mūsu sarunātā balva:</div><p class="small muted">${new Date(item.finished).toLocaleDateString('lv-LV')}${s.mode==='practice'?` · ${a.independent} patstāvīgi, ${a.assisted} pēc mājiena`:''}</p>${btn('print','Izdrukāt balvas kuponu','button-green')}</div>`:''}
<div class="result-actions">${btn('home','Uz sākumu','button-primary')}${btn('new','Jauni piemēri →','button-soft')}${btn('repeat-result','Atkārtot kļūdas','button-link',a.errors.length?'':'disabled')}</div>
${s.mode==='practice'?`<div class="stats-grid"><div class="stat"><span>Patstāvīgi, pirmajā mēģinājumā</span><strong>${a.independent}</strong></div><div class="stat"><span>Pareizi pēc mājiena</span><strong>${a.assisted}</strong></div></div><p class="small muted">Atbildes, kuras Rūdis parādīja, punktos neskaitās. Cietais rieksts dod 1 punktu tikai par abiem pareiziem soļiem.</p>`:'<p class="small muted">Katrs uzdevums dod 1 punktu. Cietais rieksts — tikai tad, ja pareizi abi soļi.</p>'}
<div class="recommendation">${recommendations(ts,a).map(x=>`<p>${x}</p>`).join('')}</div><h2 style="font-size:27px">Tavas atklātās prasmes</h2><div class="stats-grid">${resultMetric(ts,a.grades,t=>t.steps.some(s=>s.op==='+'),'Saskaitīšana')}${resultMetric(ts,a.grades,t=>t.steps.some(s=>s.op==='-'),'Atņemšana')}${resultMetric(ts,a.grades,t=>t.steps.some(s=>s.carry.length),'Ar pārnesumu')}${resultMetric(ts,a.grades,t=>t.steps.some(s=>s.borrow.length),'Ar aizņemšanos')}${C.LEVELS.map(l=>resultMetric(ts,a.grades,t=>t.level===l,labels[l])).join('')}<div class="stat"><span>Nepabeigti uzdevumi</span><strong>${a.incomplete}</strong></div><div class="stat"><span>Rēķināšanas laiks</span><strong style="font-size:17px">${timeLabel(s.elapsed)}</strong></div></div><p class="small muted">Prasmju rindās vērtēts viss uzdevums. Divu soļu uzdevums var būt vairākās prasmju rindās; rezultātā to skaita tikai vienreiz.</p><h2 style="font-size:27px;margin:26px 0 15px">Apskati savu ceļu</h2><p class="small muted">Atver uzdevumu, lai redzētu atbildes un skaidrojumu.</p>${ts.map((t,i)=>reviewHTML(t,s.responses[t.id],a.grades[i],i,s.mode)).join('')}</section>`;}
function help(){const examples=[['Bez pārnesuma',34,'+',25,['4 + 5 = 9 vieni.','3 + 2 = 5 desmiti.','Atbilde ir 59.']],['Ar pārnesumu',47,'+',38,['7 + 8 = 15. Raksti 5 vienus; pārnes 1 desmitu.','4 + 3 + 1 = 8 desmiti.','Atbilde ir 85.']],['Bez aizņemšanās',76,'-',32,['6 − 2 = 4 vieni.','7 − 3 = 4 desmiti.','Atbilde ir 44.']],['Ar aizņemšanos',83,'-',47,['No 3 nevar atņemt 7. Aizņemies 1 desmitu: tagad ir 13 vieni un 7 desmiti.','13 − 7 = 6 vieni.','7 − 4 = 3 desmiti. Atbilde ir 36.']],['Kad atbildē ir simti',87,'+',59,['7 + 9 = 16. Raksti 6; pārnes 1 desmitu.','8 + 5 + 1 = 14 desmiti. Raksti 4 desmitus; pārnes 1 simtu.','Atbilde ir 146.']]];showDialog('Kā rēķināt stabiņā?',`<p>Vieni zem vieniem. Desmiti zem desmitiem. <strong>Vienmēr sāc no labās puses!</strong></p><p class="small muted" style="margin:12px 0">Lodziņos raksti pa vienam ciparam. Pēc cipara kursors pāriet vienu vietu pa kreisi. Ar Backspace vari dzēst un atgriezties; ar bultiņām — pārvietoties. Mazajos pierakstos drīksti atzīmēt pārnesumu vai aizņemšanos.</p>${examples.map((e,i)=>`<details ${i===0?'open':''}><summary>${e[0]}</summary><div class="help-example"><div class="help-column" aria-label="${e[1]} ${e[2]} ${e[3]} ir ${C.calculate(e[1],e[2],e[3])}">${String(e[1]).padStart(3,' ')}\n${e[2]==='+'?'+':'−'}${e[3]}\n───\n${String(C.calculate(e[1],e[2],e[3])).padStart(3,' ')}</div><ol>${e[4].map(x=>`<li>${x}</li>`).join('')}</ol></div></details>`).join('')}<details><summary>🥜 Divi soļi — viens Cietais rieksts</summary><p><strong>92 − 57 + 38</strong></p><div class="help-example"><div class="help-column"> 92\n−57\n───\n 35</div><p>1. solī atņem 57 no 92. Iegūsti 35. Šis skaitlis būs nākamā stabiņa augšā.</p></div><div class="help-example"><div class="help-column"> 35\n+38\n───\n 73</div><p>2. solī pie 35 pieskaiti 38. Gala atbilde ir 73.</p></div></details><p class="small" style="margin-top:16px"><strong>Pārbaudi sevi:</strong> saskaitīšanu pārbaudi ar atņemšanu, bet atņemšanu — ar saskaitīšanu.</p>`);}
function parents(){showDialog('Mazajiem atklājējiem. Lielajiem palīgiem.',`<div class="stack"><p><strong>Matemātikas piedzīvojums — 2. klase.</strong> 300 iepriekš sagatavoti uzdevumi: katrā salā 150. Uzdevumi tiek atlasīti tā, lai retāk atkārtotos.</p><p><strong>Līdz 100:</strong> saskaitīšana, atņemšana, decimālais sastāvs, pārnesums, aizņemšanās un rezultāta pārbaude. Saturs sasaistīts ar Skola2030 tematu 2.3. “Kā saskaita un atņem divciparu skaitļus?”. Šī ir patstāvīga treniņlietotne, nevis Skola2030 oficiāls produkts.</p><p><strong>Līdz 200:</strong> papildu izaicinājums. Tas nav apzīmēts kā obligāta 2. klases apguves prasība. 20, 25 un 30 uzdevumu darbā ir viens divu soļu “Cietais rieksts”.</p><p><strong>Treniņā</strong> pirmajā kļūdā bērns saņem mājienu, otrajā — skaidrojumu un atbildi. Punktu iegūst par pareizu atbildi pirms tās parādīšanas. Rezultātā atšķir pirmo mēģinājumu un atbildes pēc mājiena.</p><p><strong>Pārbaudes darbā</strong> atbildes vērtē tikai noslēgumā. Nepabeigtie un nepareizie uzdevumi dod 0 punktu. “Cietais rieksts” dod 1 punktu tikai par abiem pareiziem soļiem.</p><p><strong>Balva:</strong> kupons parādās tikai tad, ja visi 30 uzdevumi ir pareizi; treniņā drīkst izmantot mājienu, taču neviena atbilde nedrīkst būt atklāta. Pirms darba vienojieties par mazu balvu — kopīgu spēli, laiku divatā vai ko citu piemērotu.</p><div><strong>Uzdevumu sadalījums</strong><table><thead><tr><th>Kopā</th><th>Viegli</th><th>Vidēji</th><th>Grūti</th><th>Rieksts</th></tr></thead><tbody>${Object.entries(C.SPLITS).map(([n,parts])=>`<tr><td>${n}</td>${parts.map(p=>`<td>${p}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="small">Kļūdu atkārtošanā sadalījums atkarīgs no iepriekšējām kļūdām.</p></div><p class="small">Progress un pēdējie 10 darbi glabājas tikai šajā pārlūkā. Uz citu ierīci tie nepāriet. Privātajā režīmā vai dažos pārlūkos, atverot vietējo failu, saglabāšana var nebūt pieejama. Laiks netiek skaitīts pauzes ekrānā vai tad, kad lapa ir paslēpta.</p><p class="small"><a href="https://mape.gov.lv/materials/31468F8A-365C-4CB7-9D33-DDD1E1C2E0BA" target="_blank" rel="noopener noreferrer">Skola2030 2.3. temata avots ↗</a> (saitei vajadzīgs internets)</p><button class="button-soft" id="clear-data">Notīrīt saglabāto vēsturi un progresu</button></div>`);document.getElementById('clear-data').onclick=()=>{document.getElementById('modal-body').innerHTML='<p>Tiks izdzēsta šajā pārlūkā saglabātā darbu vēsture, kļūdas un nepabeigtais darbs.</p><div class="row wrap" style="margin-top:20px"><button id="clear-cancel" class="button-soft">Saglabāt</button><button id="clear-confirm" class="button-primary">Jā, notīrīt</button></div>';document.getElementById('clear-cancel').onclick=closeDialog;document.getElementById('clear-confirm').onclick=()=>{db={seen:{A:[],B:[]},history:[],errors:[],active:null};session=null;lastResult=null;save();closeDialog();renderHome();toast('Vēsture ir notīrīta. Sākam jaunu stāstu!');};};}
function history(){showDialog('Mani piedzīvojumi',db.history.length?`<p class="small muted" style="margin-bottom:18px">Tavi pēdējie 10 darbi šajā pārlūkā.</p><div class="stack">${db.history.map((h,i)=>{const a=C.analyze(tasks(h.session),h.session.responses,h.session.mode);return`<button class="row spread" data-history="${i}"><span style="text-align:left">${new Date(h.finished).toLocaleDateString('lv-LV')}<small style="display:block">${h.session.mode==='test'?'Pārbaude':'Treniņš'} · līdz ${h.session.bank==='A'?100:200}</small></span><strong>${a.score}/${a.total} ${a.reward?'🎁':'↗'}</strong></button>`;}).join('')}</div>`:'<p>Te parādīsies tavi pabeigtie piedzīvojumi. Pirmais jau gaida!</p>');modal.querySelectorAll('[data-history]').forEach(el=>el.onclick=()=>{if(session)saveSession();closeDialog();renderResult(db.history[Number(el.dataset.history)]);});}
function confetti(n){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const d=document.createElement('div');d.className='confetti';d.setAttribute('aria-hidden','true');for(let i=0;i<n;i++){const c=document.createElement('i');c.style.left=(Math.random()*100)+'%';c.style.background=['#e9663d','#226452','#e7be51','#91babc'][i%4];c.style.animationDelay=(Math.random()*.5)+'s';d.append(c);}document.body.append(d);setTimeout(()=>d.remove(),3500);}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,v=b.dataset.value;switch(action){case'count':settings.count=Number(v);break;case'bank':settings.bank=v;break;case'mode':settings.mode=v;break;case'start':requestStart();return;case'resume':session=db.active;notice=null;setView('game');renderGame();return;case'pause':saveSession();renderHome();return;case'help':help();return;case'check':check();return;case'notes':{const r=session.responses[session.ids[session.index]];r.showNotes=!r.showNotes;saveSession();renderGame();return;}case'step':changeStep(Number(v));return;case'next-step':changeStep(1);return;case'next':case'skip':next();return;case'previous':session.index--;notice=null;saveSession();renderGame();focusDigit();return;case'jump':session.index=Number(v);notice=null;saveSession();renderGame();return;case'finish':requestFinish();return;case'home':renderHub();return;case'activity':ACTIVITIES.find(a=>a.id===v)?.open();return;case'new':if(lastResult){settings={bank:lastResult.session.bank,count:C.SPLITS[lastResult.session.count]?lastResult.session.count:10,mode:lastResult.session.mode};}requestStart();return;case'repeat-result':{const s=lastResult.session;settings.bank=s.bank;requestStart(C.analyze(tasks(s),s.responses,s.mode).errors);return;}case'repeat-all':requestStart(db.errors.filter(id=>byId[id].bank===settings.bank));return;case'print':window.print();return;default:return;}save();const scroll=window.scrollY;renderHome();window.scrollTo(0,scroll);const target=app.querySelector(`[data-action="${action}"][data-value="${v}"]`);target?.focus({preventScroll:true});});
app.addEventListener('input',handleInput);
app.addEventListener('focusin',e=>{if(e.target.matches('.digit,.note-digit'))e.target.select();});
app.addEventListener('keydown',e=>{const el=e.target;if(!el.matches('.digit')||el.readOnly)return;const i=Number(el.dataset.digit);if(e.key==='Backspace'&&!el.value&&i<2){e.preventDefault();const next=app.querySelector(`[data-digit="${i+1}"]`);next.focus();next.select();}if(e.key==='ArrowLeft'&&i>0){e.preventDefault();app.querySelector(`[data-digit="${i-1}"]`).focus();}if(e.key==='ArrowRight'&&i<2){e.preventDefault();app.querySelector(`[data-digit="${i+1}"]`).focus();}if(e.key==='Enter'){e.preventDefault();if(session.mode==='practice')check();else{const t=byId[session.ids[session.index]],r=session.responses[t.id];if(t.steps.length===2&&r.step===0)changeStep(1);else next();}}});
document.getElementById('help-open').onclick=help;document.getElementById('parents-open').onclick=parents;document.getElementById('history-open').onclick=history;document.getElementById('modal-close').onclick=closeDialog;modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
window.addEventListener('pagehide',()=>{if(view==='game')saveSession();});document.addEventListener('visibilitychange',()=>{if(document.hidden){lastTick=Date.now();if(session)save();}else lastTick=Date.now();});setInterval(()=>{if(view==='game')saveSession();},5000);
load();const errors=C.validateBank(BANK);if(errors.length){app.innerHTML='<p style="padding:30px">Uzdevumu banku neizdevās pārbaudīt. Lūdzu, atver nebojātu lietotnes failu.</p>';console.error(errors);}else renderHub();
})();
</script>
